<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUBBOG | Live Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">s
            <h2>TUBBOG</h2>
            
            <div id="theme-toggle" class="theme-switch-wrapper">
                <span id="theme-icon">🌙</span>
                <span id="theme-text">Dark Mode</span>
            </div>

            <nav class="nav-links">
                <a href="index.html" class="nav-item active">📊 Live Dashboard</a>
                <a href="tubbog_logs.html" class="nav-item">📂 Historical Logs</a>
            </nav>
            <div style="margin-top: 40px;">
                <label style="font-size: 12px; color: var(--text-dim);">DANGER THRESHOLD (m)</label>
                <input type="number" id="threshold-input" value="5.0" step="0.5" 
                       style="width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text-main); padding: 10px; margin-top:5px; border-radius: 4px;">
            </div>
        </aside>

        <main class="main-content">
            <div class="stats-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px;">
                <div class="stat-card">
                    <div style="color: var(--text-dim); font-size: 12px;">WATER DEPTH</div>
                    <div class="stat-value" id="cur-depth" style="font-size: 28px; font-weight: bold;">0.00 m</div>
                </div>
                <div class="stat-card">
                    <div style="color: var(--text-dim); font-size: 12px;">RISE SPEED</div>
                    <div class="stat-value" id="cur-speed" style="font-size: 28px; font-weight: bold; color: #9b59b6;">0.00 m/s</div>
                </div>
                <div class="stat-card">
                    <div style="color: var(--text-dim); font-size: 12px;">STATUS</div>
                    <div class="stat-value" id="cur-status" style="font-size: 28px; font-weight: bold;">NORMAL</div>
                </div>
            </div>

            <div class="monitor-frame" style="background: var(--monitor-bg); padding: 40px; border-radius: 15px; border: 2px solid var(--border); margin-bottom: 40px; position: relative; transition: background 0.3s;">
                <svg viewBox="0 0 1000 300" preserveAspectRatio="none" style="width:100%; height:300px;">
                    <line id="thresh-line" stroke="var(--danger)" stroke-dasharray="8" x1="0" y1="150" x2="1000" y2="150" />
                    <polyline id="water-path" fill="none" stroke="#3498db" stroke-width="3" points="" />
                </svg>
            </div>

            <div class="log-section">
                <h3>Recent Live Activity</h3>
                <table id="logTable">
                    <thead><tr><th>TIME</th><th>LEVEL</th><th>SPEED</th><th>ACTION</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

<script>
    // Theme Logic
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeText = document.getElementById('theme-text');

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('tubbog_theme', theme);
        themeIcon.innerText = theme === 'light' ? '☀️' : '🌙';
        themeText.innerText = theme === 'light' ? 'Light Mode' : 'Dark Mode';
    }

    themeBtn.addEventListener('click', () => {
        const newTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        applyTheme(newTheme);
    });

    applyTheme(localStorage.getItem('tubbog_theme') || 'dark');

    let points = [];
    let lastLevel = 3.0;
    
    function simulate() {
        const threshold = parseFloat(document.getElementById('threshold-input').value);
        let currentLevel = Math.max(0.5, Math.min(9.8, lastLevel + (Math.random() - 0.45) * 1.6));
        let speed = Math.abs(currentLevel - lastLevel).toFixed(2);
        lastLevel = currentLevel;

        const now = new Date();
        const time = now.toLocaleTimeString();
        const dateStr = now.toLocaleDateString();
        const isDanger = currentLevel >= threshold;

        document.getElementById('cur-depth').innerText = currentLevel.toFixed(2) + " m";
        document.getElementById('cur-speed').innerText = speed + " m/s";
        const status = document.getElementById('cur-status');
        status.innerText = isDanger ? "CRITICAL" : "NORMAL";
        status.style.color = isDanger ? "var(--danger)" : "var(--success)";

        points.push({ x: 1000, y: 300 - (currentLevel * 30) });
        points = points.map(p => ({ x: p.x - 20, y: p.y }));
        if (points.length > 55) points.shift();
        document.getElementById('water-path').setAttribute('points', points.map(p => `${p.x},${p.y}`).join(' '));

        let logs = JSON.parse(localStorage.getItem('tubbog_db')) || [];
        logs.push({ date: dateStr, time, level: currentLevel.toFixed(2), speed });
        if(logs.length > 500) logs.shift();
        localStorage.setItem('tubbog_db', JSON.stringify(logs));

        const row = `<tr><td>${time}</td><td>${currentLevel.toFixed(2)}m</td><td>${speed}</td><td style="color:${isDanger?'var(--danger)':'var(--success)'}">${isDanger?'⚠️ ALERT':'✓ Logged'}</td></tr>`;
        document.querySelector('#logTable tbody').insertAdjacentHTML('afterbegin', row);
        if (document.querySelector('#logTable tbody').children.length > 8) document.querySelector('#logTable tbody').lastElementChild.remove();
    }

    setInterval(simulate, 2000);
    simulate();
</script>
</body>
</html>
