<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUBBOG | Live Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>TUBBOG</h2>
            <p style="font-size: 12px; color: var(--text-dim);">Team Nepo Babies</p>
            
            <nav class="nav-links">
                <a href="index.html" class="nav-item active">📊 Live Dashboard</a>
                <a href="tubbog_logs.html" class="nav-item">📂 Historical Logs</a>
            </nav>

            <div class="theme-switch-wrapper">
                <label class="theme-switch">
                    <input type="checkbox" id="theme-checkbox" onchange="toggleTheme()">
                    <span class="slider"></span>
                </label>
                <span style="font-size: 12px; font-weight: bold; color: var(--text-dim);">Light Mode</span>
            </div>

            <div style="margin-top: 40px;">
                <label style="font-size: 12px; color: var(--text-dim);">DANGER THRESHOLD (m)</label>
                <input type="number" id="threshold-input" value="5.0" step="0.5" 
                       style="width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text-main); padding: 10px; margin-top:5px; border-radius: 4px;">
            </div>
        </aside>

        <main class="main-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div style="color: var(--text-dim); font-size: 12px;">WATER DEPTH</div>
                    <div class="stat-value" id="cur-depth">0.00 m</div>
                </div>
                <div class="stat-card">
                    <div style="color: var(--text-dim); font-size: 12px;">RISE SPEED</div>
                    <div class="stat-value" id="cur-speed" style="color: #9b59b6;">0.00 m/s</div>
                </div>
                <div class="stat-card">
                    <div style="color: var(--text-dim); font-size: 12px;">STATUS</div>
                    <div class="stat-value" id="cur-status">NORMAL</div>
                </div>
            </div>

            <div class="monitor-frame">
                <div class="y-axis">
                    <span>10m</span><span>8m</span><span>6m</span><span>4m</span><span>2m</span><span>0m</span>
                </div>
                <svg viewBox="0 0 1000 300" preserveAspectRatio="none">
                    <line id="thresh-line" stroke="var(--danger)" stroke-dasharray="8" x1="0" y1="150" x2="1000" y2="150" />
                    <polyline id="water-path" class="water-line" points="" />
                </svg>
            </div>

            <div class="log-section">
                <h3>Recent Live Activity</h3>
                <table id="logTable">
                    <thead><tr><th>TIME</th><th>LEVEL</th><th>SPEED</th><th>ACTION</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

<script>
    // Theme Logic
    function toggleTheme() {
        const isChecked = document.getElementById('theme-checkbox').checked;
        const theme = isChecked ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('tubbog_theme', theme);
    }

    const savedTheme = localStorage.getItem('tubbog_theme');
    if (savedTheme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('theme-checkbox').checked = true;
    }

    // Simulation Logic
    let points = [];
    let lastLevel = 3.0;
    
    function simulate() {
        const threshold = parseFloat(document.getElementById('threshold-input').value);
        let drift = (Math.random() - 0.45) * 1.6; 
        let currentLevel = Math.max(0.5, Math.min(9.8, lastLevel + drift));
        let speed = Math.abs(currentLevel - lastLevel).toFixed(2);
        lastLevel = currentLevel;

        const time = new Date().toLocaleTimeString();
        const isDanger = currentLevel >= threshold;

        // Update Text
        document.getElementById('cur-depth').innerText = currentLevel.toFixed(2) + " m";
        document.getElementById('cur-speed').innerText = speed + " m/s";
        const status = document.getElementById('cur-status');
        
        // CHANGED: "NOMINAL" to "NORMAL"
        status.innerText = isDanger ? "CRITICAL" : "NORMAL";
        status.style.color = isDanger ? "var(--danger)" : "var(--success)";

        // Update Threshold Line Y position
        const threshY = 300 - (threshold * 30);
        document.getElementById('thresh-line').setAttribute('y1', threshY);
        document.getElementById('thresh-line').setAttribute('y2', threshY);

        // Update Graph Points
        points = points.map(p => ({ x: p.x - 20, y: p.y }));
        points.push({ x: 1000, y: 300 - (currentLevel * 30) });
        if (points.length > 55) points.shift();
        document.getElementById('water-path').setAttribute('points', points.map(p => `${p.x},${p.y}`).join(' '));

        // Update Table
        const tableBody = document.querySelector('#logTable tbody');
        const row = `<tr>
            <td>${time}</td>
            <td>${currentLevel.toFixed(2)}m</td>
            <td>${speed}</td>
            <td style="color: ${isDanger ? 'var(--danger)' : 'var(--success)'}; font-weight:bold;">${isDanger ? '⚠️ ALERT SENT' : '✓ Logged'}</td>
        </tr>`;
        tableBody.insertAdjacentHTML('afterbegin', row);
        if (tableBody.children.length > 8) tableBody.lastElementChild.remove();

        // Save to LocalStorage
        let logs = JSON.parse(localStorage.getItem('tubbog_db')) || [];
        logs.push({ date: new Date().toLocaleDateString(), time, level: currentLevel.toFixed(2), speed });
        if(logs.length > 100) logs.shift();
        localStorage.setItem('tubbog_db', JSON.stringify(logs));
    }

    setInterval(simulate, 2000);
    simulate();
</script>
</body>
</html>
