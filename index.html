<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TUBBOG | Live Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>TUBBOG</h2>

            <button id="theme-toggle" style="width: 100%; padding: 10px; margin-bottom: 20px; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); font-weight: bold; transition: all 0.3s;">
                🌓 Toggle Theme
            </button>

            <div style="margin-bottom: 20px;">
                <label style="font-size: 11px; color: var(--text-dim);">VIEW MODE</label>
                <select id="view-select" style="width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text-main); padding: 10px; border-radius: 8px;">
                    <option value="sensor1">Sensor 1</option>
                    <option value="sensor2">Sensor 2</option>
                    <option value="sensor3">Sensor 3</option>
                    <option value="flow_sensor">Flow Sensor</option>
                    <option value="all">All Sensors</option>
                </select>
            </div>

            <nav class="nav-links">
                <a href="index.html" class="nav-item active">📊 Live Dashboard</a>
                <a href="tubbog_logs.html" class="nav-item">📂 Historical Logs</a>
                <a href="tubbog_stats.html" class="nav-item">📈 Statistical Report</a>
            </nav>

            <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
                <label style="font-size: 11px; font-weight: bold; color: #3498db;">THRESHOLDS (m)</label>
                <div style="margin-top:10px;">
                    <label style="font-size:10px; color:var(--text-dim);">Sensor 1</label>
                    <input type="number" id="thresh-sensor1" value="5.0" step="0.1" style="width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text-main); padding:5px;">
                </div>
                <div style="margin-top:10px;">
                    <label style="font-size:10px; color:var(--text-dim);">Sensor 2</label>
                    <input type="number" id="thresh-sensor2" value="5.0" step="0.1" style="width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text-main); padding:5px;">
                </div>
                <div style="margin-top:10px;">
                    <label style="font-size:10px; color:var(--text-dim);">Sensor 3</label>
                    <input type="number" id="thresh-sensor3" value="5.0" step="0.1" style="width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text-main); padding:5px;">
                </div>
                <div style="margin-top:10px;">
                    <label style="font-size:10px; color:var(--text-dim);">Flow (L/m)</label>
                    <input type="number" id="thresh-flow_sensor" value="15.0" step="0.5" style="width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text-main); padding:5px;">
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="dashboard-header">
                <div>
                    <h1>Live Monitoring</h1>
                    <p style="color: var(--text-dim); margin: 5px 0 0 0; font-size: 14px;">Real-time high-fidelity sensor tracking</p>
                </div>
                <div id="live-clock" style="font-weight: bold; font-size: 1.2rem; color: var(--text-main);"></div>
            </header>

            <div class="stats-grid">
                <div class="stat-card">
                    <div style="color: var(--text-dim); font-size: 11px; font-weight: bold;">CURRENT LEVEL</div>
                    <div class="stat-value" id="cur-depth" style="font-size: 24px; font-weight: bold; margin-top: 5px;">0.00 m</div>
                </div>
                <div class="stat-card">
                    <div style="color: var(--text-dim); font-size: 11px; font-weight: bold;">FLOW RATE</div>
                    <div class="stat-value" id="cur-flow" style="color: #f1c40f; font-size: 24px; font-weight: bold; margin-top: 5px;">0.00</div>
                </div>
                <div class="stat-card">
                    <div style="color: var(--text-dim); font-size: 11px; font-weight: bold;">SYSTEM STATUS</div>
                    <div class="stat-value" id="cur-status" style="font-size: 24px; font-weight: bold; margin-top: 5px;">NORMAL</div>
                </div>
            </div>

            <div id="monitor-container" style="margin-top: 20px; display: grid; grid-template-columns: 1fr; gap: 20px;"></div>

            <div class="log-section">
                <h3 style="margin-top: 0;">Live Feed</h3>
                <table id="logTable">
                    <thead>
                        <tr>
                            <th>SOURCE</th>
                            <th>TIME</th>
                            <th>LEVEL</th>
                            <th>FLOW</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const themeBtn = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme');
        const DB_KEY = 'tubbog_db_v2';
        let charts = {};

        if (currentTheme === 'light') document.body.classList.add('light-mode');

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
            location.reload();
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);

        let sensorState = {
            sensor1: { data: [], labels: [], lastVal: 3.0, color: '#3498db' },
            sensor2: { data: [], labels: [], lastVal: 2.5, color: '#e67e22' },
            sensor3: { data: [], labels: [], lastVal: 4.0, color: '#2ecc71' },
            flow_sensor: { data: [], labels: [], lastVal: 10.0, color: '#f1c40f' }
        };

        function createChart(id, color) {
            const ctx = document.getElementById(`chart-${id}`).getContext('2d');
            const isLight = document.body.classList.contains('light-mode');
            
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: id.toUpperCase(),
                        data: [],
                        borderColor: color,
                        backgroundColor: color + '22',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { 
                            beginAtZero: true,
                            grid: { color: isLight ? '#eee' : '#1d2b45' },
                            ticks: { color: isLight ? '#666' : '#5c7089' }
                        }
                    },
                    animation: { duration: 400 }
                }
            });
        }

        function updateUI() {
            const val = document.getElementById('view-select').value;
            const container = document.getElementById('monitor-container');
            container.innerHTML = '';
            charts = {};
            
            const active = val === 'all' ? Object.keys(sensorState) : [val];
            container.style.gridTemplateColumns = (val === 'all') ? '1fr 1fr' : '1fr';

            active.forEach(k => {
                container.insertAdjacentHTML('beforeend', `
                    <div style="background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); height: 250px;">
                        <div style="color:${sensorState[k].color}; font-size:12px; font-weight:bold; margin-bottom:10px;">${k.toUpperCase()} LIVE TREND</div>
                        <div style="height: 180px;"><canvas id="chart-${k}"></canvas></div>
                    </div>`);
                charts[k] = createChart(k, sensorState[k].color);
            });
        }

        function simulate() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            const activeView = document.getElementById('view-select').value;
            let globalSeverity = 0;

            Object.keys(sensorState).forEach(key => {
                const s = sensorState[key];
                const threshold = parseFloat(document.getElementById(`thresh-${key}`).value);

                let val = Math.max(0.2, s.lastVal + (Math.random() - 0.48) * 0.8);
                let flow = Math.abs(val - s.lastVal).toFixed(2);
                s.lastVal = val;

                let status = "NORMAL", statusColor = "var(--success)", severity = 0;
                if (val >= threshold) { status = "CRITICAL"; severity = 2; statusColor = "var(--danger)"; }
                else if (val >= (threshold * 0.8)) { status = "WARNING"; severity = 1; statusColor = "var(--warning)"; }

                if (activeView === 'all' || activeView === key) globalSeverity = Math.max(globalSeverity, severity);

                if (charts[key]) {
                    charts[key].data.labels.push(timeStr);
                    charts[key].data.datasets[0].data.push(val.toFixed(2));
                    if (charts[key].data.labels.length > 20) {
                        charts[key].data.labels.shift();
                        charts[key].data.datasets[0].data.shift();
                    }
                    charts[key].update('none');
                }

                let logs = JSON.parse(localStorage.getItem(DB_KEY)) || [];
                logs.push({ date: now.toLocaleDateString(), time: timeStr, sensor: key, level: val.toFixed(2), flow, status });
                if(logs.length > 500) logs.shift();
                localStorage.setItem(DB_KEY, JSON.stringify(logs));

                if (activeView === 'all' || activeView === key) {
                    const row = `<tr><td style="color:${s.color}; font-weight:bold;">${key.toUpperCase()}</td><td>${timeStr}</td><td>${val.toFixed(2)}m</td><td>${flow}</td><td style="color:${statusColor}; font-weight:bold;">${status}</td></tr>`;
                    document.querySelector('#logTable tbody').insertAdjacentHTML('afterbegin', row);
                    
                    if (activeView === key || (activeView === 'all' && key === 'sensor1')) {
                        document.getElementById('cur-depth').innerText = val.toFixed(2) + " m";
                        document.getElementById('cur-flow').innerText = flow;
                    }
                }
            });

            const statusEl = document.getElementById('cur-status');
            const labels = ["NORMAL", "WARNING", "CRITICAL"];
            const colors = ["var(--success)", "var(--warning)", "var(--danger)"];
            statusEl.innerText = labels[globalSeverity];
            statusEl.style.color = colors[globalSeverity];

            while (document.querySelector('#logTable tbody').children.length > 8) document.querySelector('#logTable tbody').lastElementChild.remove();
        }

        document.getElementById('view-select').addEventListener('change', updateUI);
        updateUI();
        setInterval(simulate, 2000);
    </script>
</body>
</html>
