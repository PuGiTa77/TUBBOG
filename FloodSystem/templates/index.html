<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TUBBOG | Live Dashboard</title>

<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<div class="dashboard-container">

<!-- SIDEBAR -->
<aside class="sidebar">
    <h2>TUBBOG</h2>

    <button id="theme-toggle" style="width:100%;padding:10px;margin-bottom:20px;border-radius:8px;">
        🌓 Toggle Theme
    </button>

    <nav class="nav-links" style="margin-top:20px;">
        <a href="/" class="nav-item active">📊 Live Dashboard</a>
        <a href="/logs" class="nav-item">📂 Historical Logs</a>
        <a href="/stats" class="nav-item">📈 Statistical Report</a>
    </nav>

    <div class="compare-box">
        <label>VIEW MODE</label>
        <select id="view-select">
            <option value="sensor1">Sensor 1</option>
            <option value="sensor2">Sensor 2</option>
            <option value="sensor3">Sensor 3</option>
            <option value="flow_sensor">Flow Sensor</option>
            <option value="all" selected>All Sensors</option>
        </select>
    </div>

    <div class="phone-card">
        <h3>📱 Telegram ID</h3>
        <input type="text" id="phoneInput" placeholder="XXX XXX XXXX">
        <button onclick="savePhone()">Save Number</button>
        <p id="phoneStatus"></p>
    </div>
</aside>

<!-- MAIN -->
<main class="main-content">

<header>
    <h1>Live Monitoring</h1>
    <div id="live-clock"></div>
</header>

<!-- STATS -->
<div class="stats-grid">
    <div class="stat-card">
        <div>CURRENT LEVEL</div>
        <div id="cur-depth">0.00 m</div>
    </div>

    <div class="stat-card">
        <div>FLOW RATE</div>
        <div id="cur-flow">0.00</div>
    </div>

    <div class="stat-card">
        <div>SYSTEM STATUS</div>
        <div id="cur-status">NORMAL</div>
    </div>
</div>

<!-- 🔥 GRID CONTAINER -->
<div id="monitor-container" class="chart-wrapper"></div>

</main>
</div>

<script>
let charts = {};
let currentView = "all";

// 🎯 RENDER CHARTS
function renderCharts() {
    const container = document.getElementById("monitor-container");

    const viewMap = {
        sensor1: ["s1"],
        sensor2: ["s2"],
        sensor3: ["s3"],
        flow_sensor: ["flow"],
        all: ["s1","s2","s3","flow"]
    };

    const selected = viewMap[currentView]; // ✅ FIXED POSITION

    // ✅ APPLY LAYOUT SWITCH
    if (selected.length === 1) {
        container.classList.add("single-view");
    } else {
        container.classList.remove("single-view");
    }

    container.innerHTML = "";
    charts = {};

    selected.forEach(id => {
        const title = id === "flow" ? "FLOW SENSOR" : id.toUpperCase();

        container.innerHTML += `
        <div class="chart-card">
            <h3>${title}</h3>
            <canvas id="chart-${id}"></canvas>
        </div>`;
    });

    selected.forEach(id => {
        const colors = {
            s1: "#4e73df",
            s2: "#f39c12",
            s3: "#2ecc71",
            flow: "#f1c40f"
        };

        charts[id] = createChart(id, colors[id]);
    });
}

// 🎨 CREATE CHART
function createChart(id, color) {
    const ctx = document.getElementById(`chart-${id}`).getContext('2d');

    const gradient = ctx.createLinearGradient(0, 0, 0, 300);
    gradient.addColorStop(0, color + "88");
    gradient.addColorStop(1, color + "00");

    return new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: id.toUpperCase(),
                data: [],
                borderColor: color,
                backgroundColor: gradient,
                fill: true,
                tension: 0.45,
                pointRadius: 2,
                pointHoverRadius: 6,
                borderWidth: 3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                mode: 'nearest',
                intersect: false
            },
            plugins: {
                legend: { labels: { color: "#ccc" } }
            },
            scales: {
                x: {
                    ticks: { color: "#888" },
                    grid: { color: "rgba(255,255,255,0.04)" }
                },
                y: {
                    ticks: { color: "#888" },
                    grid: { color: "rgba(255,255,255,0.04)" }
                }
            }
        }
    });
}

// 🔄 LOAD DATA
async function loadData() {
    const res = await fetch("/data");
    const data = await res.json();

    const time = new Date().toLocaleTimeString();

    document.getElementById("cur-depth").innerText = data.s1 + " m";
    document.getElementById("cur-flow").innerText = data.flow;
    document.getElementById("cur-status").innerText = data.status;
    document.getElementById("live-clock").innerText = time;

    const map = {
        s1: data.s1,
        s2: data.s2,
        s3: data.s3,
        flow: data.flow
    };

    Object.keys(charts).forEach(id => {
        updateChart(charts[id], time, map[id]);
    });
}

// 📈 UPDATE
function updateChart(chart, label, value) {
    chart.data.labels.push(label);
    chart.data.datasets[0].data.push(value);

    if (chart.data.labels.length > 10) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
    }

    chart.update();
}

// 🎯 VIEW SELECT
document.getElementById("view-select").addEventListener("change", function() {
    currentView = this.value;
    renderCharts();
});

// 🚀 INIT
renderCharts();
setInterval(loadData, 2000);

// 🌙 THEME
const toggleBtn = document.getElementById("theme-toggle");

const savedTheme = localStorage.getItem("theme");
if(savedTheme){
    document.documentElement.setAttribute("data-theme", savedTheme);
}

toggleBtn.onclick = () => {
    const current = document.documentElement.getAttribute("data-theme");
    const newTheme = current === "light" ? "dark" : "light";

    document.documentElement.setAttribute("data-theme", newTheme);
    localStorage.setItem("theme", newTheme);
};
</script>

</body>
</html>
