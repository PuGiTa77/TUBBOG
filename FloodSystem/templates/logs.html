<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Historical Logs</title>

<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="dashboard-container">

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>TUBBOG</h2>

    <button id="theme-toggle" style="width: 100%; padding: 10px; margin-bottom: 20px; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); font-weight: bold; transition: all 0.3s;">
                    🌓 Toggle Theme
                 </button>

 <nav class="nav-links" style="margin-top:20px;">
    <a href="/" class="nav-item">📊 Live Dashboard</a>
    <a href="/logs" class="nav-item active">📂 Historical Logs</a>
    <a href="/stats" class="nav-item">📈 Statistical Report</a>
</nav>
    <!-- CALENDAR -->
    <div class="calendar-box">
        <div class="calendar-header">
            <button onclick="prevMonth()">‹</button>
            <span id="monthYear"></span>
            <button onclick="nextMonth()">›</button>
        </div>
        <div id="calendarDays" class="calendar-grid"></div>
    </div>
</div>

<!-- MAIN -->
<div class="main-content">

<h1>📂 Historical Records</h1>

<!-- CHARTS -->
<div class="chart-grid">

    <div class="chart-card">
        <h3>📈 Water Level Trend</h3>
        <canvas id="levelChart"></canvas>
    </div>

    <div class="chart-card">
        <h3>🥧 Status Distribution</h3>
        <canvas id="statusChart"></canvas>
    </div>

</div>

<!-- TABLE -->
<div class="logs-container">
    <table class="logs-table">
        <thead>
            <tr>
                <th>Date & Time</th>
                <th>Sensor</th>
                <th>Level</th>
                <th>Flow</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="logTable"></tbody>
    </table>
</div>

</div>
</div>

<script>


/* GLOBAL CHARTS */
let levelChart, statusChart;

/* LOAD DATA */
async function loadLogs(date=null){
    let url = "/api/logs";
    if(date) url += "?date=" + date;

    const res = await fetch(url);
    const logs = await res.json();

    const table = document.getElementById("logTable");
    table.innerHTML = "";

    let times = [];
    let levels = [];

    let normal = 0, warning = 0, critical = 0;

    logs.forEach(l=>{
        table.innerHTML += `
            <tr>
                <td>${l.timestamp}</td>
                <td>Sensor 1</td>
                <td>${l.s1}</td>
                <td>${l.flow}</td>
                <td class="status-${l.status.toLowerCase()}">${l.status}</td>
            </tr>
        `;

        times.push(new Date(l.timestamp).toLocaleTimeString());
        levels.push(l.s1);

        if(l.status === "NORMAL") normal++;
        else if(l.status === "WARNING") warning++;
        else if(l.status === "CRITICAL") critical++;
    });

    updateCharts(times, levels, normal, warning, critical);
}

/* UPDATE CHARTS */
function updateCharts(times, levels, normal, warning, critical){

    if(levelChart) levelChart.destroy();
    if(statusChart) statusChart.destroy();

    // LINE CHART (TOOLTIP STYLE)
    levelChart = new Chart(document.getElementById("levelChart"), {
        type: "line",
        data: {
            labels: times,
            datasets: [{
                data: levels,
                borderColor: "#4e73df",
                tension: 0.4,
                fill: false,
                pointRadius: 0,
                pointHoverRadius: 6,
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,

            animation: {
                duration: 1000,
                easing: 'easeInOutQuart'
            },

            plugins: {
                legend: { display: false },
                tooltip: {
                    enabled: true,
                    mode: 'index',
                    intersect: false
                }
            },

            interaction: {
                mode: 'nearest',
                intersect: false
            },

            scales: {
                x: {
                    ticks: { color: '#888' }
                },
                y: {
                    ticks: { display: false },
                    grid: { color: 'rgba(255,255,255,0.05)' }
                }
            }
        }
    });

    // PIE CHART
    statusChart = new Chart(document.getElementById("statusChart"), {
        type: "pie",
        data: {
            labels: ["Normal", "Warning", "Critical"],
            datasets: [{
                data: [normal, warning, critical],
                backgroundColor: ["#00e676", "#ffcc00", "#ff4d4d"]
            }]
        }
    });
}

/* CALENDAR */
let current = new Date();

function selectDate(element, date){
    document.querySelectorAll(".day").forEach(d => d.classList.remove("active-day"));
    element.classList.add("active-day");
    loadLogs(date);
}

function renderCalendar(){
    const container = document.getElementById("calendarDays");
    container.innerHTML = "";

    let year = current.getFullYear();
    let month = current.getMonth();

    document.getElementById("monthYear").innerText =
        new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(current);

    let firstDay = new Date(year, month, 1).getDay();
    let days = new Date(year, month+1, 0).getDate();

    for(let i=0;i<firstDay;i++) container.innerHTML += `<div></div>`;

    for(let d=1; d<=days; d++){
        let date = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        container.innerHTML += `
            <div class="day" onclick="selectDate(this, '${date}')">${d}</div>
        `;
    }
}

function prevMonth(){ current.setMonth(current.getMonth()-1); renderCalendar(); }
function nextMonth(){ current.setMonth(current.getMonth()+1); renderCalendar(); }

/* INIT */
renderCalendar();
loadLogs();

const toggleBtn = document.getElementById("theme-toggle");

// Load saved theme
const savedTheme = localStorage.getItem("theme");
if(savedTheme){
    document.documentElement.setAttribute("data-theme", savedTheme);
}

toggleBtn.onclick = () => {
    const current = document.documentElement.getAttribute("data-theme");

    const newTheme = current === "light" ? "dark" : "light";

    document.documentElement.setAttribute("data-theme", newTheme);
    localStorage.setItem("theme", newTheme);
};
</script>

</body>
</html>
